            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        [data-anima="bottom"] {
            animation: fadeUp forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translate3d(0, 20px, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        [data-anima="left"] {
            animation: fadeLeft forwards;
        }

        @keyframes fadeLeft {
            from {
                opacity: 0;
                transform: translate3d(-20px, 0, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        [data-anima="right"] {
            animation: fadeRight forwards;
        }

        @keyframes fadeRight {
            from {
                opacity: 0;
                transform: translate3d(20px, 0, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Bounce */
        [data-anima="bouncein"] {
            animation: bounceIn both;
        }

        @keyframes bounceIn {
            from {
                opacity: 0;
                transform: scale3d(0.3, 0.3, 0.3);
            }

            50% {
                opacity: 1;
                transform: scale3d(1.05, 1.05, 1.05);
            }

            70% {
                transform: scale3d(0.9, 0.9, 0.9);
            }

            to {
                transform: scale3d(1, 1, 1);
            }
        }

        [data-anima="bounce-left"] {
            animation: bounceLeft both;
        }

        @keyframes bounceLeft {
            from {
                opacity: 0;
                transform: translate3d(-500px, 0, 0) scaleX(0.1);
            }

            60% {
                opacity: 1;
                transform: translate3d(30px, 0, 0) scaleX(1.1);
            }

            80% {
                transform: translate3d(-10px, 0, 0) scaleX(0.9);
            }

            to {
                transform: translate3d(0, 0, 0);
            }
        }

        [data-anima="bounce-right"] {
            animation: bounceRight both;
        }

        @keyframes bounceRight {
            from {
                opacity: 0;
                transform: translate3d(500px, 0, 0) scaleX(0.1);
            }

            60% {
                opacity: 1;
                transform: translate3d(-30px, 0, 0) scaleX(1.1);
            }

            80% {
                transform: translate3d(10px, 0, 0) scaleX(0.9);
            }

            to {
                transform: translate3d(0, 0, 0);
            }
        }

    <style type="text/css">
        .form-content input[type="radio"],
        .form-content input[type="checkbox"] {
            padding: inherit !important;
            border: none !important;
            -webkit-appearance: auto !important;
            -moz-appearance: auto !important;
            appearance: auto !important;
            width: 15px !important;
            margin-top: -13px !important;
        }

        .form-content input[type="radio"],
        .form-content input[type="checkbox"] {
            height: 35px;
        }

        .form-content input {
            display: block;
        }

        .form-content label {
            color: var(--label-color) !important;
            display: inline-block !important
        }

        .form-content input:hover {
            border-color: var(--input-border-color) !important;
        }

        .form-content a {
            color: var(--label-color) !important;
            text-align: center !important;
        }

        .form-content a {
            font-size: 13px;
        }

        .form-content input::-moz-placeholder {
            color: var(--placeholder-color) !important;
        }

        .form-content input::placeholder {
            color: var(--placeholder-color) !important;
        }

        .form-content input {
            border-color: var(--input-border-color) !important;
            color: var(--placeholder-color) !important;
            background-color: var(--input-background) !important;
            border-radius: var(--input-radius) !important;
